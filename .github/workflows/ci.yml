name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.48.0

jobs:
  check:
    runs-on: ubuntu-latest
    # Same toolchain and libraries as the package.
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rust just tzdata libxkbcommon wayland

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Install nFPM
        run: |
          cd "$(mktemp -d)"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -sSfLO "$base/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          install -m755 nfpm /usr/local/bin/nfpm

      # Build only, so nfpm.yaml breakage shows up before a release.
      - run: just package

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.pkg.tar.zst
