name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.48.0

jobs:
  release:
    runs-on: ubuntu-latest
    # So the binary links against current Arch libraries.
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git github-cli rust just tzdata libxkbcommon wayland namcap

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install nFPM
        run: |
          cd "$(mktemp -d)"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -sSfLO "$base/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          install -m755 nfpm /usr/local/bin/nfpm

      - name: Check the tag against Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - run: cargo test --locked
      - run: just package

      - name: namcap
        # Flags missing or unneeded `depends`, which are kept by hand.
        run: namcap dist/*.pkg.tar.zst || true

      - name: Smoke test the package
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          test -x /usr/bin/cosmic-ext-applet-gcal-next
          test -f /usr/share/applications/io.github.flip1995.CosmicExtAppletGcalNext.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.flip1995.CosmicExtAppletGcalNext.svg
          cosmic-ext-applet-gcal-next --version
          out="$(TZ=Europe/Berlin cosmic-ext-applet-gcal-next --once \
            --ics-file tests/fixtures/google.ics --now 2026-11-10T09:55:00+01:00)"
          echo "$out"
          test "$out" = "tier<=5m 5m | Daily standup | 2026-11-10 10:00"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd dist
          sha256sum *.pkg.tar.zst > SHA256SUMS
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "Install with:"
            echo
            echo '```sh'
            echo "sudo pacman -U https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(ls *.pkg.tar.zst)"
            echo '```'
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            *.pkg.tar.zst SHA256SUMS
