# Arch Linux package, built by `just package` (nfpm package --packager archlinux).
name: cosmic-ext-applet-gcal-next
arch: amd64 # nFPM translates this to x86_64 for archlinux
platform: linux
version: ${VERSION} # from the git tag / Cargo.toml, without the leading "v"
release: 1 # bump only for packaging-only fixes
maintainer: Philipp Krones <hello@philkrones.com>
description: Minimal COSMIC panel applet showing the time to your next Google Calendar meeting
homepage: https://github.com/flip1995/cosmic-ext-applet-gcal-next
license: MIT OR Apache-2.0

# Maintained by hand (nFPM does not detect shared libraries). Derived from
# `ldd target/release/…` + `pacman -Qo`, plus the dlopen()ed libwayland-client.
# Re-check when bumping libcosmic; namcap in release.yml flags gaps.
depends:
  - cosmic-panel
  - glibc
  - hicolor-icon-theme # owns the icon directories we install into
  - libgcc
  - libxkbcommon
  - wayland

archlinux:
  packager: Philipp Krones <hello@philkrones.com>

contents:
  - src: target/release/cosmic-ext-applet-gcal-next
    dst: /usr/bin/cosmic-ext-applet-gcal-next
    file_info:
      mode: 0755
  - src: resources/app.desktop
    dst: /usr/share/applications/io.github.flip1995.CosmicExtAppletGcalNext.desktop
    file_info:
      mode: 0644
  - src: resources/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.flip1995.CosmicExtAppletGcalNext.svg
    file_info:
      mode: 0644
  - src: LICENSE-MIT
    dst: /usr/share/licenses/cosmic-ext-applet-gcal-next/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/licenses/cosmic-ext-applet-gcal-next/LICENSE-APACHE
    file_info:
      mode: 0644
