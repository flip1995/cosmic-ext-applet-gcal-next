[package]
name = "cosmic-ext-applet-gcal-next"
version = "1.0.1"
authors = ["flip1995 <hello@philkrones.com>"]
edition = "2024"
description = "Minimal COSMIC panel applet showing the time to your next Google Calendar meeting"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
libcosmic = { git = "https://github.com/pop-os/libcosmic", version = "1.0.0", default-features = false, features = ["applet", "tokio", "wayland"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
ron = "0.12.3"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "fs", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
